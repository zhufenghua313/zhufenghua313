<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运动会管理系统 · M9 汇总导出</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314213D'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23E8BC4F'%3E%F0%9F%8F%83%3C/text%3E%3C/svg%3E">
<style>
  :root{--deep:#14213D;--deep2:#1B2A4A;--deep3:#2A4370;--gold:#D9A521;--goldL:#E8BC4F;--goldbg:#FBF6E9;--bg:#F4F6FA;--card:#fff;--line:#DFE4EC;--ink:#1A2233;--sub:#5B6577;--err:#B03A2E;--ok:#2E7D4F;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
  .wrap{max-width:900px;margin:0 auto;padding:22px 16px 70px;}
  nav{position:sticky;top:0;z-index:50;background:rgba(20,33,61,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(217,165,33,.25);}
  .nav-in{flex-wrap:wrap;max-width:900px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .nav-title{color:#fff;font-size:17px;font-weight:600;}
  .btn-out{background:rgba(255,255,255,.08);color:rgba(255,255,255,.92);border:1.5px solid rgba(255,255,255,.5);border-radius:9px;font-size:14px;padding:7px 14px;cursor:pointer;font-family:inherit;font-weight:600;}
  .hero{background:linear-gradient(120deg,var(--deep),var(--deep2) 60%,var(--deep3));color:#fff;padding:38px 20px 34px;text-align:center;position:relative;overflow:hidden;}
  .hero::before{content:"";position:absolute;left:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:rgba(217,165,33,.10);}
  .hero h1{font-size:26px;letter-spacing:2px;}
  .hero h1 em{font-style:normal;color:var(--goldL);}
  .hero p{font-size:13.5px;opacity:.85;margin-top:8px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px;box-shadow:0 3px 14px rgba(20,33,61,.06);}
  .card h2{font-size:17px;color:var(--deep);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .card h2::before{content:"";display:inline-block;width:4px;height:18px;background:var(--gold);border-radius:2px;}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .btn{border:none;border-radius:10px;padding:11px 20px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn-gold{background:linear-gradient(135deg,var(--gold),var(--goldL));color:#14213D;}
  .btn-ghost{background:#fff;color:var(--deep);border:1px solid var(--line);}
  .msg{font-size:13.5px;margin-top:6px;min-height:20px;}
  .msg.ok{color:var(--ok);}.msg.err{color:var(--err);}
  .paper{background:#fff;border:1px solid #C9D2E0;border-radius:4px;box-shadow:0 3px 12px rgba(20,33,61,.10);padding:42px 46px;margin:16px auto;max-width:760px;position:relative;}
  .pv-tag{position:absolute;top:10px;right:12px;font-size:11px;color:#98A2B3;background:#F0F3F8;border-radius:6px;padding:2px 8px;}
  .doc h2{text-align:center;font-size:20pt;font-family:"SimHei";margin:6pt 0 14pt;}
  .doc .sub{text-align:center;font-size:10.5pt;color:#555;margin-bottom:16pt;}
  .doc table{width:100%;border-collapse:collapse;}
  .doc th,.doc td{border:1px solid #444;padding:5pt 4pt;text-align:center;font-size:10.5pt;}
  .doc th{background:#EFEBE0;font-family:"SimHei";}
  .doc .top1{background:#FFF7E0;}
  .doc .top2{background:#F6F6F6;}
  .doc .top3{background:#FDF3E7;}
  .doc .r1{font-weight:bold;color:#B8860B;}
  .rec-badge{color:#B03A2E;font-weight:bold;}
  footer{text-align:center;font-size:12.5px;color:var(--sub);margin-top:26px;line-height:1.8;}
  .grade-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .gtab{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;font-size:13.5px;cursor:pointer;font-family:inherit;color:var(--ink);}
  .gtab.act{background:var(--deep);color:#fff;border-color:var(--deep);}
  .empty{text-align:center;color:var(--sub);padding:30px 0;font-size:14px;}
</style>
</head>
<body>
<nav><div class="nav-in"><div class="brand"><span class="lamp"></span><div><b style="display:block;font-size:17px;line-height:1.2">运动会</b><span style="display:block;font-size:12px;opacity:.75;line-height:1.2">管理系统 · 汇总导出</span></div></div>
  <div class="nav-title">📊 汇总导出</div>
  <div style="display:flex;gap:8px;align-items:center;flex-shrink:0;">
    <a href="/apps/sports/home.html" style="background:rgba(255,255,255,.08);color:rgba(255,255,255,.92);border:1.5px solid rgba(255,255,255,.5);border-radius:9px;font-size:14px;padding:7px 14px;text-decoration:none;display:inline-block;font-weight:600;">🏠 工作台</a>
    <button type="button" id="btnOut" style="background:rgba(255,255,255,.08);color:rgba(255,255,255,.92);border:1.5px solid rgba(255,255,255,.5);border-radius:9px;font-size:14px;padding:7px 14px;cursor:pointer;font-family:inherit;font-weight:600;">🚪 退出登录</button>
  </div>
</div></nav>

<section class="hero">
  <h1>成绩<em>汇总</em>导出</h1>
  <p>年级成绩汇总表 · A4 打印版 · 送主席台宣读</p>
</section>

<div class="wrap">
  <div class="card">
    <h2>🖨 导出选项</h2>
    <div class="btnrow">
      <button class="btn btn-gold" type="button" id="btnWord">⬇ 下载 Word 版（A4）</button>
      <button class="btn btn-ghost" type="button" id="btnPrint">🖨 打印 / 存 PDF</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="hint" style="font-size:13px;color:var(--sub);line-height:1.8">
      汇总规则：同年级平行班比较；男女分开计分；破纪录单独加分（详见积分榜规则行）。<br>
      数据来自成绩录入（M7）→ 计分引擎（M8）实时计算——无需手动汇总。
    </div>
  </div>

  <div id="papers">
    <div class="empty">加载中…</div>
  </div>

  <footer>运动会管理系统 · M9 汇总导出 ｜ 手搓 v1 ｜ 调用 M8 计分引擎实时生成<br>规则金标准：站长的老版计分Excel ｜ A4 版式：送主席台宣读</footer>
</div>

<script>
function el(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
var DATA=null;

/* 年级分组：从班级名提取"X年级" */
function gradeOf(cn){
  var m={"一":1,"二":2,"三":3,"四":4,"五":5,"六":6};
  for(var ch of String(cn)){if(m[ch])return m[ch];}
  return 0;
}
function gName(g){return ["","一年级","二年级","三年级","四年级","五年级","六年级"][g]||"其他";}

/* 生成 A4 纸页（每年级一张 + 总分榜一张） */
function buildPapers(){
  var tot=DATA.classTotals||{};
  var det=DATA.detail||{};
  var recLog=DATA.recLog||[];
  var c=DATA.config||{};
  /* 按年级分班 */
  var byGrade={};
  Object.keys(tot).forEach(function(cls){
    var g=gradeOf(cls)||0;
    if(!byGrade[g])byGrade[g]=[];
    byGrade[g].push({cls:cls,pts:tot[cls]});
  });
  var html="";

  /* 第1张：全校总分榜 */
  html+='<div class="paper"><span class="pv-tag">A4 · 总分榜</span><div class="doc">';
  html+='<h2>班级总分榜</h2><div class="sub">（全部年级 · 男女混合计 · 含破纪录加分）</div>';
  html+='<table><tr><th>名次</th><th>班级</th><th>总分</th></tr>';
  var all=Object.keys(tot).sort(function(a,b){return tot[b]-tot[a]});
  all.forEach(function(cls,i){
    var cls3=i<3?(" top"+(i+1)):"";
    html+='<tr'+cls3+'><td><span class="r1">'+(i+1)+'</span></td><td>'+esc(cls)+'</td><td><b>'+tot[cls]+'</b></td></tr>';
  });
  if(!all.length)html+='<tr><td colspan="3">暂无得分数据</td></tr>';
  html+='</table></div></div>';

  /* 每年级一张：本年级名次 + 本年级破纪录 */
  Object.keys(byGrade).sort(function(a,b){return a-b}).forEach(function(g){
    var arr=byGrade[g].sort(function(a,b){return b.pts-a.pts});
    html+='<div class="paper"><span class="pv-tag">A4 · '+gName(g)+'</span><div class="doc">';
    html+='<h2>'+gName(g)+'成绩汇总表</h2><div class="sub">（平行班比较 · 男女分开计分 · 破纪录另加）</div>';
    html+='<table><tr><th>名次</th><th>班级</th><th>总分</th></tr>';
    arr.forEach(function(it,i){
      var cls3=i<3?(" top"+(i+1)):"";
      html+='<tr'+cls3+'><td><span class="r1">'+(i+1)+'</span></td><td>'+esc(it.cls)+'</td><td><b>'+it.pts+'</b></td></tr>';
    });
    html+='</table>';
    /* 本年级破纪录 */
    var no2class={};
    /* 号码→班级映射需从detail里带（破纪录只有no）——从积分明细补 */
    var recs=recLog.filter(function(r){
      var cls=no2class[r.no]||"";
      return gradeOf(cls)===Number(g);
    });
    if(recs.length){
      html+='<div style="height:14pt"></div><table><tr><th colspan="4">本年级破纪录</th></tr><tr><th>场次</th><th>号码</th><th>姓名</th><th>加分</th></tr>';
      recs.forEach(function(r){html+='<tr><td>'+esc(r.event)+'</td><td>'+esc(r.no)+'</td><td>'+esc(r.name)+'</td><td><span class="rec-badge">+'+r.extra+'</span></td></tr>';});
      html+='</table>';
    }
    html+='</div></div>';
  });

  el("papers").innerHTML=html;
}

/* Word 下载（Blob .doc，同M5套路但字符串已拆串） */
function downloadWord(){
  var inner=el("papers").innerHTML;
  var doc='<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8">'
    +'<title>成绩汇总表</title>'
    +'<style>@page{size:A4 portrait;margin:2cm}body{font-family:"SimSun";font-size:12pt;color:#000}'
    +'.paper{page-break-after:always;width:100%;padding:0;margin:0;border:none;box-shadow:none;min-height:0}'
    +'.paper:last-child{page-break-after:auto}'
    +'h2{text-align:center;font-family:"SimHei";font-size:16pt}table{width:100%;border-collapse:collapse}th,td{border:1px solid #444;padding:5pt;text-align:center;font-size:10.5pt}'
    +'th{background:#EFEBE0;font-family:"SimHei"}.sub{text-align:center;font-size:10.5pt;color:#555;margin-bottom:14pt}'
    +'.top1{background:#FFF7E0}.top2{background:#F6F6F6}.top3{background:#FDF3E7}.r1{font-weight:bold;color:#B8860B}'
    +'.pv-tag{display:none}.rec-badge{color:#B03A2E;font-weight:bold}'
    +'</style></head><body>'+inner+'</bo'+'dy></html>'; /* 拆串防注入误匹配 */
  var blob=new Blob(["\ufeff"+doc],{type:"application/msword"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="运动会成绩汇总表.doc";
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}

el("btnWord").addEventListener("click",downloadWord);
el("btnPrint").addEventListener("click",function(){window.print();});
el("btnOut").addEventListener("click",function(){
  fetch("/soft/__auth/logout",{method:"POST"}).then(function(){location.replace(location.pathname)})
  .catch(function(){location.replace(location.pathname)});
});

fetch("/soft/api/standings").then(function(r){return r.json()}).then(function(d){
  if(!d.ok){el("msg").className="msg err";el("msg").textContent=d.msg||"加载失败";return;}
  DATA=d;buildPapers();
}).catch(function(){el("papers").innerHTML='<div class="empty">网络异常，请刷新重试</div>';});
</script>
</body>
</html>
