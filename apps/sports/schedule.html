<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运动会管理系统 · M6 赛程</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314213D'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23E8BC4F'%3E%F0%9F%8F%83%3C/text%3E%3C/svg%3E">
<style>
  :root{--deep:#14213D;--deep2:#1B2A4A;--deep3:#2A4370;--gold:#D9A521;--goldL:#E8BC4F;--goldbg:#FBF6E9;--bg:#F4F6FA;--card:#fff;--line:#DFE4EC;--ink:#1A2233;--sub:#5B6577;--err:#B03A2E;--ok:#2E7D4F;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
  .wrap{max-width:860px;margin:0 auto;padding:22px 16px 70px;}
  nav{position:sticky;top:0;z-index:50;background:rgba(20,33,61,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(217,165,33,.3);}
  .nav-in{flex-wrap:wrap;max-width:860px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{flex-shrink:0;display:flex;align-items:center;gap:10px;color:#fff;font-size:16px;}
  .brand b{font-weight:600;}
  .btn-out{background:rgba(255,255,255,.08);color:rgba(255,255,255,.92);border:1.5px solid rgba(255,255,255,.5);border-radius:9px;font-size:14px;padding:7px 14px;cursor:pointer;font-family:inherit;font-weight:600;}
  .hero{background:linear-gradient(120deg,var(--deep),var(--deep2));color:#fff;padding:34px 20px 26px;text-align:center;position:relative;overflow:hidden;margin-bottom:18px;border-radius:0 0 18px 18px;}
  .hero h1{font-size:24px;letter-spacing:2px;}
  .hero h1 em{color:var(--goldL);font-style:normal;}
  .hero p{font-size:13px;opacity:.8;margin-top:8px;line-height:1.7;}
  .toolbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:18px;}
  .btn{border:none;border-radius:10px;padding:10px 20px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn-gold{background:linear-gradient(135deg,var(--gold),var(--goldL));color:var(--deep);}
  .btn-ghost{background:#fff;color:var(--deep);border:1px solid var(--line);}
  .btn-ghost.red{color:var(--err);border-color:#E5C6C0;}
  .msg{text-align:center;font-size:13.5px;min-height:20px;margin-bottom:10px;}
  .msg.ok{color:var(--ok);}.msg.err{color:var(--err);}
  .day{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:18px;overflow:hidden;box-shadow:0 3px 12px rgba(20,33,61,.05);}
  .day-head{background:linear-gradient(120deg,var(--deep2),var(--deep3));color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .day-head b{font-size:15.5px;letter-spacing:1px;}
  .day-head .ops{display:flex;gap:6px;}
  .day-head button{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit;}
  .day-body{padding:6px 0;}
  .item{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid #F0F2F6;}
  .item:last-child{border-bottom:none;}
  .item .no{width:30px;height:30px;border-radius:8px;background:var(--goldbg);color:#8A6D1C;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13.5px;flex-shrink:0;}
  .item .name{flex:1;min-width:0;font-size:15px;}
  .item .remark{font-size:12px;color:var(--sub);margin-top:2px;}
  .item .ops{display:flex;gap:5px;flex-shrink:0;}
  .item .ops button{background:#fff;border:1px solid var(--line);border-radius:7px;width:30px;height:30px;font-size:13px;cursor:pointer;color:var(--deep);}
  .item .ops button.del{color:var(--err);border-color:#E5C6C0;}
  .item .ops button:disabled{opacity:.3;cursor:default;}
  .hint{font-size:13px;color:var(--sub);background:var(--goldbg);border-left:4px solid var(--gold);border-radius:8px;padding:10px 14px;margin-bottom:16px;line-height:1.8;}
  footer{text-align:center;font-size:12.5px;color:var(--sub);margin-top:26px;line-height:1.8;}
  .empty{text-align:center;color:var(--sub);padding:30px 0;font-size:14px;}
  @media print{nav,.toolbar,.btn-out{display:none!important}.day{box-shadow:none;page-break-inside:avoid}}
  .lamp{width:10px;height:10px;border-radius:50%;background:#E8BC4F;box-shadow:0 0 8px #E8BC4F;animation:br 2s infinite;}
  @keyframes br{50%{opacity:.35;}}
</style>
<style>
  header.top{background:linear-gradient(120deg,#14213D,#1B2A4A);color:#fff;border-radius:16px;padding:24px 26px;margin:16px 0;position:relative;overflow:hidden;}
  header.top h1{font-size:21px;margin:0 0 6px;}
  header.top p{color:#C9D4E8;font-size:13.5px;margin:0;line-height:1.7;}
  header.top::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(217,165,33,.08);}
  </style>
</head>
<body>
<nav><div class="nav-in">
  <div class="brand" style="color:#fff;display:flex;align-items:center;gap:10px;flex-shrink:0"><span class="lamp" style="display:inline-block;flex-shrink:0;width:10px;height:10px;border-radius:50%;background:#E8BC4F;box-shadow:0 0 8px #E8BC4F;animation:br 2s infinite;align-self:center"></span><div><b style="display:block;font-size:17px;line-height:1.2;color:#fff">运动会</b><span style="display:block;font-size:12px;opacity:.75;line-height:1.2;color:#fff">管理系统</span></div></div>
  <div style="display:flex;gap:8px;align-items:center;flex-shrink:0;">
    <a href="/apps/sports/home.html" style="background:rgba(255,255,255,.08);color:rgba(255,255,255,.92);border:1.5px solid rgba(255,255,255,.5);border-radius:9px;font-size:14px;padding:7px 14px;text-decoration:none;display:inline-block;font-weight:600;">🏠 工作台</a>
    <button type="button" id="btnOut" style="background:rgba(255,255,255,.08);color:rgba(255,255,255,.92);border:1.5px solid rgba(255,255,255,.5);border-radius:9px;font-size:14px;padding:7px 14px;cursor:pointer;font-family:inherit;font-weight:600;">🚪 退出登录</button>
  </div>
</div></nav>

<header class="top" style="max-width:860px;margin:16px auto;">
    <h1>赛程管理</h1>
    <p>按传统自动生成竞赛日程，支持上下移微调与加比赛日</p>
  </header>


<div class="wrap">
<div class="toolbar">
  <button class="btn btn-ghost" type="button" id="btnGenAuto">⚡ 按传统自动生成</button>
  <button class="btn btn-gold" type="button" id="btnSave">💾 保存赛程</button>
  <button class="btn btn-ghost red" type="button" id="btnAddDay">＋ 加比赛日</button>
</div>
<div class="msg" id="msg"></div>

<div class="hint">ℹ️ 「按传统自动生成」按 2025 真实程序册排（v1.1 修正）：跳高一年级先赛（一→五）、跳远五年级先赛（五→一）、铅球三→五年级、径赛全部五→一倒序、400米与接力五→三压轴。一年级不排铅球/400米/接力。生成后可上下移微调。</div>

<div id="days"></div>
</div><!-- /wrap -->

<footer>运动会管理系统 · M6 赛程 ｜ 手搓 v1（管理页积木思路 + 上下移核心交互）<br>保存后程序册（M5）的竞赛日程随之更新</footer>

<script>
function el(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

var DATA=null; /* {days:[{title,items:[{name,remark}]}]} */

/* —— 渲染 —— */
function render(){
  var box=el("days");
  if(!DATA||!DATA.days.length){box.innerHTML='<div class="empty">还没有赛程——点「⚡ 按传统自动生成」或「＋ 加比赛日」</div>';return;}
  var html="";
  DATA.days.forEach(function(day,di){
    html+='<div class="day"><div class="day-head"><b>'+esc(day.title)+'</b>'
      +'<div class="ops"><button type="button" data-dayup="'+di+'" '+(di===0?"disabled":"")+'>↑ 日上移</button>'
      +'<button type="button" data-adddayitem="'+di+'">＋ 场次</button>'
      +'<button type="button" data-daydel="'+di+'" style="color:#FBB">删日</button></div></div><div class="day-body">';
    day.items.forEach(function(it,ii){
      html+='<div class="item"><div class="no">'+(ii+1)+'</div>'
        +'<div style="flex:1;min-width:0"><div class="name">'+esc(it.name)+'</div>'
        +(it.remark?'<div class="remark">'+esc(it.remark)+'</div>':'')
        +'</div><div class="ops">'
        +'<button type="button" data-up="'+di+'_'+ii+'" '+(ii===0?"disabled":"")+'>↑</button>'
        +'<button type="button" data-down="'+di+'_'+ii+'" '+(ii===day.items.length-1?"disabled":"")+'>↓</button>'
        +'<button type="button" data-edit="'+di+'_'+ii+'" title="编辑">✎</button>'
        +'<button type="button" data-del="'+di+'_'+ii+'" class="del" title="删除">✕</button>'
        +'</div></div>';
    });
    html+='</div></div>';
  });
  box.innerHTML=html;
}

/* —— 传统自动生成（程序册规律） —— */
function autoGen(){
  var g=["一年级","二年级","三年级","四年级","五年级"];
  var gHi=["三年级","四年级","五年级"];
  var field=[],track=[];
  /* v1.1 按真实程序册金标准修正（2025-04-08 程序册对照）：
     跳高 一→五正序；跳远 五→一倒序；铅球 三→五（高年级项目）
     每项目男女交替 */
  ["跳高"].forEach(function(ev){
    g.forEach(function(gr){
      field.push({name:gr+"男子"+ev+"预决赛",remark:""});
      field.push({name:gr+"女子"+ev+"预决赛",remark:""});
    });
  });
  ["跳远"].forEach(function(ev){
    for(var i=g.length-1;i>=0;i--){
      field.push({name:g[i]+"男子"+ev+"预决赛",remark:""});
      field.push({name:g[i]+"女子"+ev+"预决赛",remark:""});
    }
  });
  ["铅球"].forEach(function(ev){
    gHi.forEach(function(gr){
      field.push({name:gr+"男子"+ev+"预决赛",remark:""});
      field.push({name:gr+"女子"+ev+"预决赛",remark:""});
    });
  });
  /* 径赛：全部 五→一 倒序（60米/200米），400米/接力 五→三压轴 */
  ["60米","200米"].forEach(function(ev){
    for(var i=g.length-1;i>=0;i--){
      track.push({name:g[i]+"男子"+ev+"预决赛",remark:""});
      track.push({name:g[i]+"女子"+ev+"预决赛",remark:""});
    }
  });
  ["400米"].forEach(function(ev){
    ["五年级","四年级","三年级"].forEach(function(gr){
      track.push({name:gr+"男子"+ev+"预决赛",remark:""});
      track.push({name:gr+"女子"+ev+"预决赛",remark:""});
    });
  });
  ["4×100米混合接力"].forEach(function(ev){
    ["五年级","四年级","三年级"].forEach(function(gr){
      track.push({name:gr+ev+"预决赛",remark:"女1、2棒 男3、4棒"});
    });
  });
  /* 修正径赛名（男子/女子在年级后） */
  track=track.map(function(t){
    if(t.name.indexOf("接力")>=0)return t;
    return t;
  });
  /* 接力按规则重排：三年级→四年级→五年级（上面已按序） */
  DATA={days:[
    {title:"田赛日（第一天·下午）",items:field},
    {title:"径赛日（第二天·上午）",items:track}
  ]};
  render();
}

/* —— 事件委托：全部操作 —— */
el("days").addEventListener("click",function(e){
  var t=e.target;
  if(!t.hasAttribute)return;
  if(t.hasAttribute("data-up")||t.hasAttribute("data-down")){
    var dir=t.getAttribute("data-up")!==null?"up":"down";
    var key=(t.getAttribute("data-up")||t.getAttribute("data-down")).split("_");
    var di=+key[0],ii=+key[1];
    var arr=DATA.days[di].items;
    var j=dir==="up"?ii-1:ii+1;
    if(j<0||j>=arr.length)return;
    var tmp=arr[ii];arr[ii]=arr[j];arr[j]=tmp;
    render();return;
  }
  if(t.hasAttribute("data-edit")){
    var k2=t.getAttribute("data-edit").split("_");
    var d2=DATA.days[+k2[0]].items[+k2[1]];
    var nn=prompt("场次名（40字内）：",d2.name);
    if(nn===null)return;
    if(!nn.trim()){el("msg").className="msg err";el("msg").textContent="场次名不能为空";return;}
    d2.name=nn.trim().slice(0,40);
    var rr=prompt("备注（可空，60字内）：",d2.remark||"");
    if(rr!==null)d2.remark=rr.trim().slice(0,60);
    render();return;
  }
  if(t.hasAttribute("data-del")){
    var k3=t.getAttribute("data-del").split("_");
    var day3=DATA.days[+k3[0]];
    var it3=day3.items[+k3[1]];
    if(!confirm("删除场次「"+it3.name+"」？"))return;
    day3.items.splice(+k3[1],1);
    render();return;
  }
  if(t.hasAttribute("data-dayup")){
    var di4=+t.getAttribute("data-dayup");
    if(di4>0){var td=DATA.days[di4];DATA.days[di4]=DATA.days[di4-1];DATA.days[di4-1]=td;render();}
    return;
  }
  if(t.hasAttribute("data-daydel")){
    var di5=+t.getAttribute("data-daydel");
    if(!confirm("删除整个「"+DATA.days[di5].title+"」（含全部场次）？"))return;
    DATA.days.splice(di5,1);render();return;
  }
  if(t.hasAttribute("data-adddayitem")){
    var di6=+t.getAttribute("data-adddayitem");
    var nn2=prompt("新场次名：","");
    if(nn2===null||!nn2.trim())return;
    DATA.days[di6].items.push({name:nn2.trim().slice(0,40),remark:""});
    render();return;
  }
});

el("btnAddDay").addEventListener("click",function(){
  var tt=prompt("新比赛日标题（如：雨天补赛日）：","");
  if(tt===null||!tt.trim())return;
  if(!DATA)DATA={days:[]};
  DATA.days.push({title:tt.trim().slice(0,30),items:[]});
  render();
});
el("btnGenAuto").addEventListener("click",function(){
  if(DATA&&DATA.days.length&&!confirm("已有赛程，重新自动生成将覆盖当前内容。继续？"))return;
  autoGen();
  el("msg").className="msg ok";el("msg").textContent="已按传统生成，可上下移微调";
});
el("btnSave").addEventListener("click",function(){
  if(!DATA||!DATA.days.length){el("msg").className="msg err";el("msg").textContent="赛程为空，先生成或添加";return;}
  var fd=new FormData();fd.append("schedule",JSON.stringify(DATA));
  fetch("/soft/api/schedule-save",{method:"POST",body:fd})
    .then(function(r){return r.json()})
    .then(function(d){el("msg").className="msg "+(d.ok?"ok":"err");el("msg").textContent=d.msg||"";})
    .catch(function(){el("msg").className="msg err";el("msg").textContent="网络异常";});
});
el("btnOut").addEventListener("click",function(){
  fetch("/soft/__auth/logout",{method:"POST"}).then(function(){location.replace(location.pathname)})
  .catch(function(){location.replace(location.pathname)});
});

/* —— 加载 —— */
fetch("/soft/api/schedule").then(function(r){return r.json()}).then(function(d){
  if(!d.ok){el("msg").className="msg err";el("msg").textContent=d.msg||"加载失败";return;}
  DATA=d.schedule;
  render();
}).catch(function(){el("msg").className="msg err";el("msg").textContent="网络异常，请刷新重试";});
</script>
</body>
</html>
